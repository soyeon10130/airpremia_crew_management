<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;color:#111;background:#f7f7f7;padding:16px}
input,select,button,textarea{font-family:inherit;font-size:13px}
input[type=text],input[type=email],input[type=tel],select,textarea{padding:7px 10px;border:0.5px solid #ccc;border-radius:8px;width:100%;outline:none;background:#fff;color:#111}
input:focus,select:focus,textarea:focus{border-color:#378add}
button{cursor:pointer;border-radius:8px;border:0.5px solid #ccc;padding:6px 14px;background:#fff;color:#333}
button:hover{background:#f5f5f5}
.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:500;white-space:nowrap}
.card{background:#fff;border:0.5px solid #e0e0e0;border-radius:8px;padding:13px 13px 11px;display:flex;flex-direction:column}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:#fff;border-radius:12px;padding:24px 26px;width:520px;max-width:calc(100vw - 28px);max-height:90vh;overflow-y:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:10px;font-size:13px;font-weight:500;z-index:300;white-space:nowrap;pointer-events:none}
.photo-wrap{position:relative;cursor:pointer;flex-shrink:0}
.photo-wrap:hover .photo-overlay{opacity:1}
.photo-overlay{position:absolute;inset:0;border-radius:7px;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;font-size:18px}
.stat-card{border-radius:8px;padding:10px 12px}
label.fl{font-size:12px;color:#666;display:block;margin-bottom:3px}
.grid-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;border:0.5px solid #ccc;border-radius:8px;overflow:hidden;background:#fff}
.tab{padding:7px 16px;font-size:13px;border:none;border-right:0.5px solid #ccc;cursor:pointer;background:transparent;color:#666;border-radius:0}
.tab:last-child{border-right:none}
.tab.active{background:#f0f0f0;color:#111;font-weight:500}
.main-tabs{margin-bottom:14px}
.main-tabs .tab{min-width:96px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;padding-top:9px;border-top:0.5px solid #eee;margin-bottom:10px}
.info-label{font-size:10px;color:#999;margin-bottom:1px}
.info-val{font-size:11px;color:#222}
.actions{display:flex;gap:5px}
.actions button{flex:1;font-size:11px;padding:5px 0;border-radius:6px}
.table-wrap{background:#fff;border:0.5px solid #e0e0e0;border-radius:8px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:980px}
th,td{border-bottom:0.5px solid #ececec;padding:9px 10px;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#fafafa;font-size:12px;color:#666;font-weight:600;z-index:1}
td{font-size:13px;color:#222}
tr:hover td{background:#fcfcfc}
.muted{color:#999}
@media(max-width:720px){
  body{padding:10px}
  .stats{grid-template-columns:repeat(2,1fr)!important}
  .modal{padding:20px}
}
</style>

}

function restoreAppointDates(list){
  return list.map(p => {
    if (p.appointDate || p.role === "수습부기장") return p;
    const appointDate = APPOINT_DATE_BY_ID[p.id] || "";
    return appointDate ? {...p, appointDate} : p;
  });
}

function applyInitialRoleOverrides(captains, fos){
  const moveSet = new Set(INITIAL_UPGRADE_TRAINEE_IDS);
  const trainees = captains
    .filter(p => moveSet.has(p.id))
    .map(p => ({...p, role:"기장승격훈련요원", position:"기장승격훈련요원"}));
  return {
    captains: captains.filter(p => !moveSet.has(p.id)),
    fos: [...trainees, ...fos.filter(p => !moveSet.has(p.id))],
  };
}

function applyPinnedCrewCorrections(captains, fos){
  const all = [...captains, ...fos];
  const promotedSet = new Set(PINNED_PROMOTED_CAPTAIN_IDS);
  const uniqueById = list => [...new Map(list.map(p => [p.id, p])).values()];
  const correctedCaptains = uniqueById(all
    .filter(p => p.id !== "P223002" && (captains.some(c => c.id === p.id) || promotedSet.has(p.id)))
    .map(p => promotedSet.has(p.id) ? {...p, role:"기장", position:"기장", appointDate:p.appointDate || today()} : p));
  const correctedFos = uniqueById(all
    .filter(p => p.id !== "P223002" && !correctedCaptains.some(c => c.id === p.id))
    .map(p => promotedSet.has(p.id) ? {...p, role:"기장", position:"기장", appointDate:p.appointDate || today()} : p));
  const kim = all.find(p => p.id === "P223002");
  if(kim) correctedFos.unshift({...kim, role:"기장승격훈련요원", position:"기장승격훈련요원", appointDate:kim.appointDate || APPOINT_DATE_BY_ID.P223002 || ""});
  return { captains: correctedCaptains, fos: correctedFos };
}

async function savePhoto(id, dataUrl) {
  let localOk=false;
  try {
    localStorage.setItem(PHOTO_PREFIX + id, dataUrl);
    localOk=true;
  } catch(e) {
    console.warn("localStorage 사진 저장 실패:", id, e);
  }
  try {
    await savePhotoDb(id, dataUrl);
    return true;
  } catch(e) {
    console.warn("IndexedDB 사진 저장 실패:", id, e);
    return localOk;
  }
}

function openPhotoDb(){
  return new Promise((resolve,reject)=>{
    if(!("indexedDB" in window)){reject(new Error("IndexedDB를 사용할 수 없습니다."));return;}
    const req=indexedDB.open(PHOTO_DB_NAME,1);
    req.onupgradeneeded=()=>req.result.createObjectStore(PHOTO_STORE_NAME);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}

async function savePhotoDb(id,dataUrl){
  const db=await openPhotoDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(PHOTO_STORE_NAME,"readwrite");
    tx.objectStore(PHOTO_STORE_NAME).put(dataUrl,id);
    tx.oncomplete=()=>{db.close();resolve(true);};
    tx.onerror=()=>{db.close();reject(tx.error);};
  });
}

async function loadAllPhotosDb(){
  try {
    const db=await openPhotoDb();
    return await new Promise((resolve,reject)=>{
      const photos={};
      const tx=db.transaction(PHOTO_STORE_NAME,"readonly");
      const store=tx.objectStore(PHOTO_STORE_NAME);
      const req=store.openCursor();
      req.onsuccess=()=>{
        const cursor=req.result;
        if(cursor){
          photos[cursor.key]=cursor.value;
          cursor.continue();
        }
      };
      tx.oncomplete=()=>{db.close();resolve(photos);};
      tx.onerror=()=>{db.close();reject(tx.error);};
    });
  } catch(e) {
    console.warn("IndexedDB 사진 로딩 실패:", e);
    return {};
  }
}

async function clearPhotoDb(){
  const db=await openPhotoDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(PHOTO_STORE_NAME,"readwrite");
    tx.objectStore(PHOTO_STORE_NAME).clear();
    tx.oncomplete=()=>{db.close();resolve(true);};
    tx.onerror=()=>{db.close();reject(tx.error);};
  });
}

function compressImageFile(file, maxWidth=420, maxHeight=520, quality=0.78){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(reader.error);
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("이미지 파일을 읽지 못했습니다."));
      img.onload=()=>{
        const scale=Math.min(maxWidth/img.width,maxHeight/img.height,1);
        const w=Math.max(1,Math.round(img.width*scale));
        const h=Math.max(1,Math.round(img.height*scale));
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function loadAllPhotos() {
  const photos = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith(PHOTO_PREFIX)) photos[key.slice(PHOTO_PREFIX.length)] = localStorage.getItem(key);
    }
  } catch(e) { console.warn("사진 로딩 실패:", e); }
  return photos;
}

function deletePhoto(id) {
  try { localStorage.removeItem(PHOTO_PREFIX + id); } catch(e) {}
  openPhotoDb().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(PHOTO_STORE_NAME,"readwrite");
    tx.objectStore(PHOTO_STORE_NAME).delete(id);
    tx.oncomplete=()=>{db.close();resolve(true);};
    tx.onerror=()=>{db.close();reject(tx.error);};
  })).catch(e=>console.warn("IndexedDB 사진 삭제 실패:", e));
}

  const styles={ok:{bg:"#eaf3de",color:"#27500a",border:"#3b6d11"},err:{bg:"#fcebeb",color:"#791f1f",border:"#e24b4a"},warn:{bg:"#faeeda",color:"#633806",border:"#854f0b"}};

}

function handlePhotoFallback(img){
  const fallbacks=["jpg","jpeg","png","webp"];
  const current=Number(img.dataset.photoFallback||"0");
  const id=img.src.split("/").pop().split(".")[0];
  const next=current+1;
  if(next<fallbacks.length){
    img.dataset.photoFallback=String(next);
    img.src=`photos/${id}.${fallbacks[next]}`;
    return;
  }
  const name=img.dataset.name||"";
  const role=img.dataset.role||"부기장";
  const size=Number(img.dataset.size||76);
  const wrap=document.createElement("div");
  wrap.innerHTML=mkAvatar(name,role,size);
  img.replaceWith(wrap.firstElementChild);

function matchSearch(p){
  const normalize=v=>String(v??"").toLowerCase().replace(/\s+/g,"");
  const s=normalize(state.search);
  const hay=normalize([p.name,p.id,p.role,p.position,p.joinDate,p.appointDate,p.birthDate,p.phone,p.email,p.address].join(" "));
  return !s || hay.includes(s);
}

function leaderPriority(p){
  const pos=p.position||"";
  if(pos.includes("본부장")) return 0;
  if(pos.includes("팀장")) return 1;
  if(pos.includes("파트장")) return 2;
  return 9;
}

function leaderManualOrder(p){
  const order={P263010:0,P203004:1};
  return order[p.id] ?? 99;
}

function sortCrewPeople(list){
  return [...list].sort((a,b)=>{
    const pa=leaderPriority(a);
    const pb=leaderPriority(b);
    if(pa!==pb) return pa-pb;
    const ma=leaderManualOrder(a);
    const mb=leaderManualOrder(b);
    if(ma!==mb) return ma-mb;
    return (a.name||"").localeCompare(b.name||"","ko-KR");
  });
}

function filtered(){
  const base=state.search.trim()?allCrew():getList();
  return sortCrewPeople(base.filter(p=>matchSearch(p) && (state.filterRole==="전체"||p.role===state.filterRole)));
}

          state.formPhotoPreview=await compressImageFile(file);
          render();
        } catch(err) {
          console.error(err);
          showToast("사진 파일을 읽지 못했습니다.","err");
        }
        e.target.value="";
      };
    }
    const listSelect=document.getElementById("ff-listName");
    if(listSelect) listSelect.onchange=()=>{ state.editList=listSelect.value; state.form.role=state.editList==="기장"?"기장":"부기장"; state.form.position=state.form.role; render(); };
    ["name","id","joinDate","appointDate","birthDate","phone","email","address","position","role"].forEach(k=>{
      const el=document.getElementById("ff-"+k);
      if(el)el.oninput=el.onchange=()=>{state.form[k]=el.value;};
    });
  }
}

function pickPhoto(id){
  const inp=document.createElement("input");
  inp.type="file";inp.accept="image/*";
  inp.onchange=async e=>{
    const file=e.target.files[0];if(!file)return;
    try {
      const dataUrl=await compressImageFile(file);
      const saved=await savePhoto(id,dataUrl);
      if(!saved){showToast("브라우저 저장 공간이 부족해 사진을 저장하지 못했습니다.","err");return;}
      state.photos[id]=dataUrl;
      render();
      showToast("사진이 저장되었습니다.");
    } catch(err) {
      console.error(err);
      showToast("사진 파일을 읽지 못했습니다.","err");
    }
  };
  inp.click();
}

function handleBulkPhotos(inp){
  const files=Array.from(inp.files);
  let done=0, failed=0;
  const saves=files.map(async file=>{
    const id=file.name.replace(/\.[^.]+$/,"").trim();
    try {
      const dataUrl=await compressImageFile(file);
      if(await savePhoto(id,dataUrl)){
        state.photos[id]=dataUrl;
        done++;
      } else {
        failed++;
      }
    } catch(err) {
      console.error("사진 처리 실패:", file.name, err);
      failed++;
    }
  });
  Promise.all(saves).then(()=>{
    render();
    if(failed) showToast(`사진 ${done}장 저장, ${failed}장 실패: 저장 공간을 확인해주세요.`,"warn");
    else showToast(`사진 ${done}장 저장 완료`);
    inp.value="";
  });
}

function clearAllPhotos(){
  if(!confirm("저장된 사진을 모두 삭제할까요? 인사정보는 삭제되지 않습니다.")) return;
  Object.keys(state.photos).forEach(id=>deletePhoto(id));
  clearPhotoDb().catch(e=>console.warn("IndexedDB 사진 초기화 실패:", e));
  state.photos={};
  render();
  showToast("저장된 사진을 모두 삭제했습니다.","warn");
}

function loadSheetJs(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    script.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    script.onload=()=>window.XLSX?resolve(window.XLSX):reject(new Error("Excel 파서를 불러오지 못했습니다."));
    script.onerror=()=>reject(new Error("Excel 파서를 불러오지 못했습니다."));
    document.head.appendChild(script);
  });
}

function cleanCell(v){
  return String(v ?? "").replace(/\s+/g," ").trim();
}

function formatImportedDate(v){
  if(!v) return "";
  if(v instanceof Date && !isNaN(v)) {
    return `${v.getFullYear()}.${String(v.getMonth()+1).padStart(2,"0")}.${String(v.getDate()).padStart(2,"0")}`;
  }
  const s=cleanCell(v).replace(/\s*\.\s*/g,".").replace(/-/g,".");
  const m=s.match(/^(\d{4})\.(\d{1,2})\.(\d{1,2})/);
  if(m) return `${m[1]}.${m[2].padStart(2,"0")}.${m[3].padStart(2,"0")}`;
  return s;
}

function formatImportedPhone(v){
  const digits=String(v ?? "").replace(/\D/g,"");
  if(!digits) return "";
  const phone=digits.length===10 && digits.startsWith("10") ? "0"+digits : digits;
  if(phone.length===11 && phone.startsWith("010")) return `${phone.slice(0,3)}-${phone.slice(3,7)}-${phone.slice(7)}`;
  if(phone.length===10 && phone.startsWith("02")) return `${phone.slice(0,2)}-${phone.slice(2,6)}-${phone.slice(6)}`;
  return phone;
}

function findHeaderIndex(headers, aliases){
  return headers.findIndex(h=>aliases.some(alias=>h.includes(alias)));
}

function inferDefaultImportRole(fileName, sheetName){
  const source=`${fileName} ${sheetName}`;
  if(source.includes("부기장")) return {listName:"부기장",role:"수습부기장",position:"수습부기장"};
  if(source.includes("기장")) return {listName:"기장",role:"훈련기장",position:"훈련기장"};
  return {listName:"부기장",role:"수습부기장",position:"수습부기장"};
}

function parseHrRowsFromSheet(rows, fileName, sheetName){
  const headerRowIndex=rows.findIndex(row=>{
    const values=row.map(cleanCell);
    return values.some(v=>v==="사번") && values.some(v=>["성명","지원자명","이름"].includes(v));
  });
  if(headerRowIndex<0) return [];
  const headers=rows[headerRowIndex].map(cleanCell);
  const idx={
    id:findHeaderIndex(headers,["사번"]),
    name:findHeaderIndex(headers,["성명","지원자명","이름"]),
    role:findHeaderIndex(headers,["직위"]),
    joinDate:findHeaderIndex(headers,["입사일","입사일자"]),
    birthDate:findHeaderIndex(headers,["생년월일"]),
    phone:findHeaderIndex(headers,["휴대폰번호","휴대폰","지원자 전화번호","전화번호"]),
    email:findHeaderIndex(headers,["사내이메일","이메일"]),
    address:findHeaderIndex(headers,["현거주주소","주소"]),
  };
  const defaults=inferDefaultImportRole(fileName,sheetName);
  return rows.slice(headerRowIndex+1).map(row=>{
    const id=cleanCell(row[idx.id]);
    const name=cleanCell(row[idx.name]);
    if(!id||!name) return null;
    const importedPosition=idx.role>=0?cleanCell(row[idx.role]):"";
    const importedRole=importedPosition?importedPosition.replace(/\(.*?\)/g,"").trim():defaults.role;
    return {
      ...normalizePerson({
      id,
      name,
      role:importedRole||defaults.role,
      position:importedPosition||defaults.position,
      joinDate:idx.joinDate>=0?formatImportedDate(row[idx.joinDate]):"",
      appointDate:"",
      birthDate:idx.birthDate>=0?formatImportedDate(row[idx.birthDate]):"",
      phone:idx.phone>=0?formatImportedPhone(row[idx.phone]):"",
      email:idx.email>=0?cleanCell(row[idx.email]):"",
      address:idx.address>=0?cleanCell(row[idx.address]):"",
      }),
      listName:defaults.listName,
    };
  }).filter(Boolean);
}

function mergeImportedPeople(imported){
  let added=0, updated=0;
  const mergeIntoList=(list,p)=>list.map(existing=>{
    if(existing.id!==p.id) return existing;
    updated++;
    return {
      ...existing,
      name:p.name||existing.name,
      birthDate:p.birthDate||existing.birthDate,
      phone:p.phone||existing.phone,
      email:p.email||existing.email,
      address:p.address||existing.address,
      joinDate:p.joinDate||existing.joinDate,
      appointDate:existing.appointDate||p.appointDate,
    };
  });

  imported.forEach(p=>{
    const inCaptains=state.captains.some(x=>x.id===p.id);
    const inFos=state.fos.some(x=>x.id===p.id);
    if(inCaptains) state.captains=mergeIntoList(state.captains,p);
    else if(inFos) state.fos=mergeIntoList(state.fos,p);
    else {
      const target=p.listName==="기장"||["기장","훈련기장","수습기장"].includes(p.role) ? "기장" : "부기장";
      if(target==="기장") state.captains=[...state.captains,p];
      else state.fos=[...state.fos,p];
      added++;
    }
  });
  saveCrewData();
  return {added,updated};
}

async function handleHrExcelUpload(inp){
  const file=inp.files&&inp.files[0];
  if(!file) return;
  try {
    const XLSX=await loadSheetJs();
    const data=await file.arrayBuffer();
    const wb=XLSX.read(data,{type:"array",cellDates:true});
    const imported=wb.SheetNames.flatMap(sheetName=>{
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,raw:false,defval:""});
      return parseHrRowsFromSheet(rows,file.name,sheetName);
    });
    if(!imported.length){showToast("인식 가능한 인적사항 행을 찾지 못했습니다.","err");return;}
    const result=mergeImportedPeople(imported);
    render();
    showToast(`인적사항 반영 완료: 신규 ${result.added}명, 갱신 ${result.updated}명`);
  } catch(err) {
    console.error(err);
    showToast("Excel 업로드를 처리하지 못했습니다. 인터넷 연결 또는 파일 형식을 확인해주세요.","err");
  } finally {
    inp.value="";
  }
}

function setView(v){state.view=v;state.filterRole="전체";render();}
function setTab(t){state.tab=t;state.filterRole="전체";render();}
function closeModal(){state.modal=null;state.confirmPerson=null;state.promotePerson=null;state.editList=null;render();}

function openAdd(){
  const listName=state.view==="photos"?state.tab:"부기장";
  const role=listName==="기장"?"기장":"부기장";
  state.form=emptyForm(role);
  state.editList=listName;
  state.formPhotoPreview=null;
  state.editId=null;
  state.modal="form";
  render();
}

function findPerson(id){
  const cap=state.captains.find(x=>x.id===id);
  if(cap)return {person:cap,listName:"기장"};
  const fo=state.fos.find(x=>x.id===id);
  if(fo)return {person:fo,listName:"부기장"};
  return null;
}

function openEdit(id){
  const found=findPerson(id);
  if(!found)return;
  state.form={...normalizePerson(found.person)};
  state.formPhotoPreview=state.photos[id]||null;
  state.editId=id;
  state.editList=found.listName;
  state.modal="form";
  render();
}

function openDelete(id){
  const found=findPerson(id);
  if(!found)return;
  state.confirmPerson=found.person;state.modal="delete";render();
}

function openPromote(id){
  const p=state.fos.find(x=>x.id===id);
  if(!p)return;
  state.promotePerson=p;state.modal="promote";render();
}

async function saveForm(){
  const f=normalizePerson(state.form);
  if(!f.name.trim()||!f.id.trim()){showToast("성명과 사번은 필수입니다.","err");return;}
  if(!f.position.trim()) f.position=f.role;
  const targetList=currentListName();

  const dup=allCrew().find(p=>p.id===f.id && p.id!==state.editId);
  if(dup){showToast("이미 존재하는 사번입니다.","err");return;}

  if(state.formPhotoPreview){
    if(await savePhoto(f.id,state.formPhotoPreview)) state.photos[f.id]=state.formPhotoPreview;
    else showToast("저장 공간 부족으로 사진은 저장되지 않았습니다.","warn");
  }
  if(state.editId && state.editId!==f.id && state.photos[state.editId]){
    state.photos[f.id]=state.photos[state.editId];
    if(await savePhoto(f.id,state.photos[f.id])){
      delete state.photos[state.editId];
      deletePhoto(state.editId);
    }
  }

  if(state.editId){
    if(state.editList==="기장") state.captains=state.captains.map(p=>p.id===state.editId?f:p);
    else state.fos=state.fos.map(p=>p.id===state.editId?f:p);
    showToast(`${f.name} 정보가 수정되었습니다.`);
  } else {
    if(targetList==="기장") state.captains=[...state.captains,f];
    else state.fos=[...state.fos,f];
    showToast(`${f.name} 승무원이 추가되었습니다.`);
    try {
      const api = await getFirebaseApi();
      if(api) await api.addDoc(api.collection(api.db,"crew"),{...f, listName:targetList, createdAt:new Date()});
    } catch(err) {
      console.error("Firebase 저장 실패:", err);
    }
  }

  saveCrewData();
  state.modal=null;
  state.editList=null;
  render();
}

function doDelete(id){
  const found=findPerson(id);
  if(!found)return;
  const p=found.person;
  if(found.listName==="기장") state.captains=state.captains.filter(x=>x.id!==id);
  else state.fos=state.fos.filter(x=>x.id!==id);
  delete state.photos[id];
  deletePhoto(id);
  saveCrewData();
  showToast(`${p.name} 승무원이 퇴사 처리되었습니다.`,"warn");
  state.modal=null;state.confirmPerson=null;render();
}

function doPromote(id){
  const p=state.fos.find(x=>x.id===id);
  if(!p)return;
  state.fos=state.fos.filter(x=>x.id!==id);
  state.captains=[...state.captains,{...p,role:"기장",position:"기장",appointDate:today()}];
  saveCrewData();
  showToast(`${p.name} 기장으로 승격되었습니다.`);
  state.modal=null;state.promotePerson=null;render();
}

function downloadExcel(){
  const list=filteredAll();
  const headers=["구분","성명","사번","직위","직위/직책 세부","입사일","임명일","생년월일","휴대폰","이메일","주소"];
  const rows=list.map(p=>[
    state.captains.some(x=>x.id===p.id)?"기장":"부기장",p.name,p.id,p.role,p.position,p.joinDate,p.appointDate,p.birthDate,p.phone,p.email,p.address
  ]);
  const table=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
  <head><meta charset="utf-8"><style>td,th{mso-number-format:"\\@";border:.5pt solid #ddd;padding:6px}th{background:#f2f2f2;font-weight:700}</style></head>
  <body><table><thead><tr>${headers.map(h=>`<th>${escapeHtml(h)}</th>`).join("")}</tr></thead><tbody>
  ${rows.map(row=>`<tr>${row.map(cell=>`<td>${escapeHtml(cell||"")}</td>`).join("")}</tr>`).join("")}
  </tbody></table></body></html>`;
  const blob=new Blob(["\ufeff",table],{type:"application/vnd.ms-excel;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`airpremia_crew_hr_${today()}.xls`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast("인사정보 Excel 파일을 다운로드했습니다.");
}

function doPrint(){
  const list=filtered();
  const section=state.tab==="기장"?"기장":"부기장";
  const t=new Date().toLocaleDateString("ko-KR");
  const COLS=6, PER_PAGE=18; // 6열 × 3행 = 18명/페이지
  const photoCell=p=>{
    const src=state.photos[p.id];
    const m=ROLE_META[p.role]||ROLE_META["부기장"];
    if(src)return`<img src="${src}" style="width:78px;height:88px;object-fit:cover;border-radius:5px;display:block;margin:0 auto 5px"/>`;
    return`<div style="width:78px;height:88px;border-radius:5px;background:${m.bg};border:1px solid ${m.border};display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:500;color:${m.text};margin:0 auto 5px">${escapeHtml(p.name[0]||"?")}</div>`;
  };
  const makeCell=p=>{
    const m=ROLE_META[p.role]||ROLE_META["부기장"];
    return`<td>${photoCell(p)}<div class="name">${escapeHtml(p.name)}</div><div class="badge" style="background:${m.bg};color:${m.text};border:0.5px solid ${m.border}">${escapeHtml(p.role)}</div><div class="pos">${p.position!==p.role?escapeHtml(p.position):""}</div><div class="meta"><span>사번</span> ${escapeHtml(p.id)}<br><span>입사</span> ${escapeHtml(p.joinDate||"-")}<br><span>임명</span> ${escapeHtml(p.appointDate||"-")}</div></td>`;
  };
  // 페이지 단위로 분할 (18명씩)
  const pages=[];
  for(let i=0;i<list.length;i+=PER_PAGE) pages.push(list.slice(i,i+PER_PAGE));
  const pagesHtml=pages.map((page,pi)=>{
    // 각 페이지를 6명짜리 행 3개로 분할
    const pageRows=[];
    for(let r=0;r<page.length;r+=COLS) pageRows.push(page.slice(r,r+COLS));
    const isLast=pi===pages.length-1;
    return`<div class="page${isLast?"":" page-break"}">
<div class="page-header">
  <h1>■ 에어프레미아 운항승무원 명단 (${section})</h1>
  <div class="sub">발행일: ${t} &nbsp;|&nbsp; 총 ${list.length}명 &nbsp;|&nbsp; ${pi+1}/${pages.length} 페이지 &nbsp;(No.${pi*PER_PAGE+1}–${Math.min((pi+1)*PER_PAGE,list.length)})</div>
</div>
<table>${pageRows.map(row=>`<tr>${row.map(makeCell).join("")}${row.length<COLS?`<td colspan="${COLS-row.length}" style="border:none"></td>`:""}</tr>`).join("")}</table>
</div>`;
  }).join("\n");
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@page{size:A4 landscape;margin:10mm}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:9px;color:#111;margin:0;padding:0}
.page{width:100%;box-sizing:border-box}
.page-break{page-break-after:always;break-after:page}
.page-header{margin-bottom:6px}
h1{font-size:13px;font-weight:600;margin:0 0 2px}
.sub{font-size:9px;color:#666;margin:0 0 6px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
td{vertical-align:top;padding:6px 4px;border:0.5px solid #ccc;text-align:center;width:16.666%}
.name{font-size:12px;font-weight:600;margin:2px 0}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:8px;font-weight:500;margin:2px 0 4px}
.pos{font-size:8px;color:#555;margin:2px 0 5px;line-height:1.4}
.meta{font-size:8px;color:#333;line-height:1.8;text-align:left;padding:0 4px}
.meta span{color:#999}
</style></head><body>
${pagesHtml}
</body></html>`;
  const w=window.open("","_blank","width=1200,height=850");
  w.document.write(html);w.document.close();
  w.onload=()=>{setTimeout(()=>w.print(),300);};
}
