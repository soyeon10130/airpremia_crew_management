*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;font-size:14px;color:#111;background:#f7f7f7;padding:16px}
input,select,button{font-family:inherit;font-size:13px}
input[type=text],select{padding:7px 10px;border:0.5px solid #ccc;border-radius:8px;width:100%;outline:none;background:#fff;color:#111}
input[type=text]:focus,select:focus{border-color:#378add}
button{cursor:pointer;border-radius:8px;border:0.5px solid #ccc;padding:6px 14px;background:#fff;color:#333}
button:hover{background:#f5f5f5}
.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:500;white-space:nowrap}
.card{background:#fff;border:0.5px solid #e0e0e0;border-radius:12px;padding:13px 13px 11px;display:flex;flex-direction:column;gap:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:#fff;border-radius:14px;padding:24px 26px;width:410px;max-height:90vh;overflow-y:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:10px;font-size:13px;font-weight:500;z-index:300;white-space:nowrap;pointer-events:none}
.photo-wrap{position:relative;cursor:pointer;flex-shrink:0}
.photo-wrap:hover .photo-overlay{opacity:1}
.photo-overlay{position:absolute;inset:0;border-radius:7px;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;font-size:18px}
.stat-card{border-radius:10px;padding:10px 12px}
label.fl{font-size:12px;color:#666;display:block;margin-bottom:3px}
.grid-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;border:0.5px solid #ccc;border-radius:8px;overflow:hidden}
.tab{padding:7px 16px;font-size:13px;border:none;cursor:pointer;background:transparent;color:#666}
.tab.active{background:#f0f0f0;color:#111;font-weight:500}
.tab:first-child{border-right:0.5px solid #ccc}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;padding-top:9px;border-top:0.5px solid #eee;margin-bottom:10px}
.info-label{font-size:10px;color:#999;margin-bottom:1px}
.info-val{font-size:11px;color:#222}
.actions{display:flex;gap:5px}
.actions button{flex:1;font-size:11px;padding:5px 0;border-radius:6px}
</style>

// ========================= 사진 영구 저장 헬퍼 =========================
// window.storage (Artifact persistent storage) 사용
// 키 형식: "photo:사번" → base64 문자열
async function savePhoto(id, dataUrl) {
  try {
    await window.storage.set(`photo:${id}`, dataUrl);
  } catch(e) {
    console.warn("사진 저장 실패:", e);
  }
}

async function loadAllPhotos() {
  try {
    const result = await window.storage.list("photo:");
    const photos = {};
    if (result && result.keys && result.keys.length > 0) {
      await Promise.all(result.keys.map(async key => {
        try {
          const r = await window.storage.get(key);
          if (r && r.value) {
            const id = key.replace("photo:", "");
            photos[id] = r.value;
          }
        } catch(e) {}
      }));
    }
    return photos;
  } catch(e) {
    console.warn("사진 로딩 실패:", e);
    return {};
  }
}

async function deletePhoto(id) {
  try {
    await window.storage.delete(`photo:${id}`);
  } catch(e) {}
}

  render();

// ========================= 유틸 =========================
let toastTimer=null;
function showToast(msg,type="ok"){
  clearTimeout(toastTimer);
  const t=document.getElementById("toast");
  if(!t)return;
  t.textContent=msg;
  t.style.display="block";
  const styles={
    ok: {bg:"#eaf3de",color:"#27500a",border:"#3b6d11"},
    err:{bg:"#fcebeb",color:"#791f1f",border:"#e24b4a"},
    warn:{bg:"#faeeda",color:"#633806",border:"#854f0b"}
  };
  const s=styles[type]||styles.ok;
  Object.assign(t.style,{background:s.bg,color:s.color,border:`0.5px solid ${s.border}`});
  toastTimer=setTimeout(()=>{t.style.display="none";},2800);
}

function today(){
  const d=new Date();
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
}

function mkBadge(role){
  const m=ROLE_META[role]||ROLE_META["부기장"];
  return `<span class="badge" style="background:${m.bg};color:${m.text};border:0.5px solid ${m.border}">${role}</span>`;
}

function mkAvatar(name,role,size=76){
  const m=ROLE_META[role]||ROLE_META["부기장"];
  const ch=name?name[0]:"?";
  return `<div style="width:${size}px;height:${size}px;border-radius:8px;background:${m.bg};border:1.5px solid ${m.border};display:flex;align-items:center;justify-content:center;font-size:${Math.round(size*.38)}px;font-weight:500;color:${m.text};flex-shrink:0;user-select:none">${ch}</div>`;
}

function mkPhotoCell(p,size=76){
  const src=state.photos[p.id];
  const inner=src
    ?`<img src="${src}" style="width:${size}px;height:${size}px;object-fit:cover;border-radius:8px;display:block"/>`
    :mkAvatar(p.name,p.role,size);
  return `<div class="photo-wrap" data-photoid="${p.id}" style="width:${size}px;height:${size}px" title="클릭하여 사진 변경">
    ${inner}
    <div class="photo-overlay">📷</div>
  </div>`;
}

function mkCard(p){
  const canPromote=state.tab==="부기장"&&(p.role==="부기장"||p.role==="기장승격훈련요원");
  const posExtra=p.position&&p.position!==p.role
    ?`<div style="font-size:10px;color:#888;margin-top:3px;line-height:1.4">${p.position}</div>`:"";
  return `<div class="card">
    <div style="display:flex;align-items:flex-start;gap:11px;margin-bottom:10px">
      ${mkPhotoCell(p,74)}
      <div style="flex:1;min-width:0">
        <div style="font-size:15px;font-weight:500;color:#111;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div>
        <div style="font-family:monospace;font-size:11px;color:#aaa;margin-bottom:5px">${p.id}</div>
        ${mkBadge(p.role)}
        ${posExtra}
      </div>
    </div>
    <div class="info-grid">
      <div><div class="info-label">입사년월</div><div class="info-val">${p.joinDate}</div></div>
      <div><div class="info-label">임명일</div><div class="info-val">${p.appointDate||"-"}</div></div>
    </div>
    <div class="actions">
      <button onclick="openEdit('${p.id}')">수정</button>
      ${canPromote?`<button onclick="openPromote('${p.id}')" style="background:#e6f1fb;color:#0c447c;border-color:#185fa5">기장 승격</button>`:""}
      <button onclick="openDelete('${p.id}')" style="background:#fcebeb;color:#791f1f;border-color:#e24b4a">퇴사</button>
    </div>
  </div>`;
}

function mkStats(){
  const cnt={};
  Object.keys(ROLE_META).forEach(r=>cnt[r]=0);
  [...state.captains,...state.fos].forEach(p=>{if(cnt[p.role]!==undefined)cnt[p.role]++;});
  return `<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px">
    ${Object.entries(ROLE_META).map(([r,m])=>`
      <div class="stat-card" style="background:${m.bg};border:0.5px solid ${m.border}">
        <div style="font-size:10px;color:${m.text};font-weight:500;margin-bottom:3px">${r}</div>
        <div style="font-size:22px;font-weight:500;color:${m.text}">${cnt[r]}</div>
      </div>`).join("")}
  </div>`;
}

function getList(){return state.tab==="기장"?state.captains:state.fos;}
function getAvailRoles(){return state.tab==="기장"?["기장","훈련기장"]:["기장승격훈련요원","부기장","수습부기장"];}

function filtered(){
  const s=state.search.trim();
  return getList().filter(p=>{
    const ms=!s||p.name.includes(s)||p.id.includes(s)||p.position.includes(s);
    const mr=state.filterRole==="전체"||p.role===state.filterRole;
    return ms&&mr;
  });
}

    </div></div>`;
  }
  return `<div class="overlay"><div class="modal" style="width:360px">
    <div style="font-size:16px;font-weight:500;margin-bottom:10px">기장 승격 확인</div>
    <p style="font-size:14px;color:#555;margin-bottom:18px"><strong style="color:#111">${person.name}</strong> 부기장을 기장으로 승격하시겠습니까?<br><span style="font-size:12px;color:#aaa">임명일: ${today()} 자동 기입</span></p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button onclick="closeModal()">취소</button>
      <button onclick="doPromote('${person.id}')" style="background:#e6f1fb;color:#0c447c;border-color:#185fa5;font-weight:500">승격 확정</button>
    </div>
  </div></div>`;
}

// ========================= 렌더 =========================
function render(){
  const list=filtered();
  const availRoles=getAvailRoles();
  const roleOpts=["전체",...availRoles].map(r=>`<option value="${r}"${state.filterRole===r?" selected":""}>${r}</option>`).join("");

  let modalHtml="";
  if(state.modal==="form")         modalHtml=mkFormModal();
  else if(state.modal==="delete")  modalHtml=mkConfirmModal(state.confirmPerson,"delete");
  else if(state.modal==="promote") modalHtml=mkConfirmModal(state.promotePerson,"promote");

  const loadingBanner = !state.photosLoaded
    ? `<div style="text-align:center;padding:8px;font-size:12px;color:#999;background:#fffbe6;border-radius:8px;margin-bottom:12px">📂 저장된 사진 불러오는 중...</div>`
    : "";

  document.getElementById("app").innerHTML=`
    <div style="margin-bottom:16px">
      <div style="font-size:20px;font-weight:500;margin-bottom:3px;color:#111">✈ 에어프레미아 운항승무원 명단 관리</div>
      <div style="font-size:13px;color:#888">사진 클릭으로 개별 등록 · 일괄 업로드 · PDF 출력 · <strong style="color:#27500a">사진 자동 저장됨</strong></div>
    </div>
    ${loadingBanner}
    ${mkStats()}
    <div class="grid-controls">
      <div class="tabs">
        <button class="tab${state.tab==="기장"?" active":""}" onclick="setTab('기장')">기장 (${state.captains.length})</button>
        <button class="tab${state.tab==="부기장"?" active":""}" onclick="setTab('부기장')">부기장 (${state.fos.length})</button>
      </div>
      <input type="text" id="search-inp" value="${state.search}" placeholder="이름·사번·직책 검색" style="flex:1;min-width:130px" oninput="state.search=this.value;render()"/>
      <select onchange="state.filterRole=this.value;render()">${roleOpts}</select>
      <button onclick="document.getElementById('bulk-photo-inp').click()" title="파일명=사번으로 일괄 업로드">📂 사진 일괄</button>
      <input type="file" id="bulk-photo-inp" accept="image/*" multiple style="display:none" onchange="handleBulkPhotos(this)"/>
      <button onclick="doPrint()">🖨 PDF 출력</button>
      <button onclick="openAdd()" style="background:#e6f1fb;color:#0c447c;border-color:#185fa5;font-weight:500">+ 신규 입사</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px">
      ${list.length===0?`<div style="grid-column:1/-1;padding:40px;text-align:center;color:#bbb;font-size:14px">검색 결과가 없습니다</div>`:""}
      ${list.map(mkCard).join("")}
    </div>
    <div style="font-size:12px;color:#bbb;margin-top:10px;text-align:right">${list.length}명 표시</div>
    ${modalHtml}
    <div id="toast" style="display:none" class="toast"></div>
  `;

  document.querySelectorAll(".photo-wrap[data-photoid]").forEach(el=>{
    el.onclick=()=>pickPhoto(el.dataset.photoid);
  });

  if(state.modal==="form"){
    const photobtn=document.getElementById("modal-photo-btn");
    const photofile=document.getElementById("modal-photo-file");
    if(photobtn&&photofile){
      photobtn.onclick=()=>photofile.click();
      photofile.onchange=e=>{
        const file=e.target.files[0];if(!file)return;
        const r=new FileReader();
        r.onload=ev=>{state.formPhotoPreview=ev.target.result;render();};
        r.readAsDataURL(file);
        e.target.value="";
      };
    }
    ["name","id","joinDate","appointDate","position","role"].forEach(k=>{
      const el=document.getElementById("ff-"+k);
      if(el)el.oninput=el.onchange=()=>{state.form[k]=el.value;};
    });
  }
}

// ========================= 액션 함수 =========================
function pickPhoto(id){
  const inp=document.createElement("input");
  inp.type="file";inp.accept="image/*";
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=async ev=>{
      const dataUrl=ev.target.result;
      state.photos[id]=dataUrl;
      await savePhoto(id, dataUrl);   // ← 영구 저장
      render();
      showToast("사진이 저장되었습니다.");
    };
    r.readAsDataURL(file);
  };
  inp.click();
}

async function handleBulkPhotos(inp){
  const files=Array.from(inp.files);
  let done=0;
  const saves=files.map(file=>new Promise(resolve=>{
    const base=file.name.replace(/\.[^.]+$/,"");
    const r=new FileReader();
    r.onload=async ev=>{
      const dataUrl=ev.target.result;
      state.photos[base]=dataUrl;
      await savePhoto(base, dataUrl);  // ← 영구 저장
      done++;
      resolve();
    };
    r.readAsDataURL(file);
  }));
  await Promise.all(saves);
  render();
  showToast(`사진 ${done}장 저장 완료`);
  inp.value="";
}

function setTab(t){state.tab=t;state.filterRole="전체";render();}
function closeModal(){state.modal=null;state.confirmPerson=null;state.promotePerson=null;render();}

function openAdd(){
  const r=getAvailRoles()[0];
  state.form={name:"",id:"",role:r,position:r,joinDate:"",appointDate:""};
  state.formPhotoPreview=null;state.editId=null;state.modal="form";render();
}

function openEdit(id){
  const p=[...state.captains,...state.fos].find(x=>x.id===id);
  if(!p)return;
  state.form={...p};state.formPhotoPreview=state.photos[id]||null;state.editId=id;state.modal="form";render();
}

function openDelete(id){
  const p=getList().find(x=>x.id===id);
  if(!p)return;
  state.confirmPerson=p;state.modal="delete";render();
}

function openPromote(id){
  const p=state.fos.find(x=>x.id===id);
  if(!p)return;
  state.promotePerson=p;state.modal="promote";render();
}

async function saveForm(){
  const f=state.form;
  if(!f.name.trim()||!f.id.trim()){showToast("성명과 사번은 필수입니다.","err");return;}

  // 폼에서 사진 선택했으면 영구 저장
  if(state.formPhotoPreview){
    state.photos[f.id]=state.formPhotoPreview;
    await savePhoto(f.id, state.formPhotoPreview);
  }

  if(state.editId){
    if(state.tab==="기장") state.captains=state.captains.map(p=>p.id===state.editId?{...f}:p);
    else                   state.fos=state.fos.map(p=>p.id===state.editId?{...f}:p);
    showToast(`${f.name} 정보가 수정되었습니다.`);
  } else {
    if([...state.captains,...state.fos].find(p=>p.id===f.id)){
      showToast("이미 존재하는 사번입니다.","err");return;
    }
    if(state.tab==="기장") state.captains=[...state.captains,{...f}];
    else                   state.fos=[...state.fos,{...f}];
    showToast(`${f.name} 승무원이 추가되었습니다.`);

    try {
      await addDoc(collection(db,"crew"),{...f, createdAt: new Date()});
    } catch(err){
      console.error("Firebase 저장 실패:", err);
    }
  }

  state.modal=null;
  render();
}

function doDelete(id){
  const p=getList().find(x=>x.id===id);
  if(!p)return;
  if(state.tab==="기장") state.captains=state.captains.filter(x=>x.id!==id);
  else                   state.fos=state.fos.filter(x=>x.id!==id);
  // 사진도 삭제
  delete state.photos[id];
  deletePhoto(id);
  showToast(`${p.name} 승무원이 퇴사 처리되었습니다.`,"warn");
  state.modal=null;state.confirmPerson=null;render();
}

function doPromote(id){
  const p=state.fos.find(x=>x.id===id);
  if(!p)return;
  state.fos=state.fos.filter(x=>x.id!==id);
  state.captains=[...state.captains,{...p,role:"기장",position:"기장",appointDate:today()}];
  showToast(`${p.name} 기장으로 승격되었습니다!`);
  state.modal=null;state.promotePerson=null;render();
}

function doPrint(){
  const list=filtered();
  const section=state.tab==="기장"?"기장":"부기장";
  const t=new Date().toLocaleDateString("ko-KR");
  const rows=[];
  for(let i=0;i<list.length;i+=6)rows.push(list.slice(i,i+6));

  const photoCell=p=>{
    const src=state.photos[p.id];
    const m=ROLE_META[p.role]||ROLE_META["부기장"];
    if(src)return`<img src="${src}" style="width:78px;height:88px;object-fit:cover;border-radius:5px;display:block;margin:0 auto 5px"/>`;
    return`<div style="width:78px;height:88px;border-radius:5px;background:${m.bg};border:1px solid ${m.border};display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:500;color:${m.text};margin:0 auto 5px">${p.name[0]}</div>`;
  };

  const html=`<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
@page{size:A4 landscape;margin:12mm}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:9px;color:#111}
h1{font-size:13px;font-weight:600;margin:0 0 3px}
.sub{font-size:9px;color:#666;margin:0 0 10px}
table{width:100%;border-collapse:collapse}
td{vertical-align:top;padding:7px 5px;border:0.5px solid #ccc;text-align:center;width:16.6%}
.name{font-size:12px;font-weight:600;margin:2px 0}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:8px;font-weight:500;margin:2px 0 4px}
.pos{font-size:8px;color:#555;margin:2px 0 5px;line-height:1.4}
.meta{font-size:8px;color:#333;line-height:1.8;text-align:left;padding:0 4px}
.meta span{color:#999}
</style></head><body>
<h1>■ 에어프레미아 운항승무원 명단 (${section})</h1>
<div class="sub">발행일: ${t} &nbsp;|&nbsp; 총 ${list.length}명</div>
<table>
${rows.map(row=>`<tr>${row.map(p=>{const m=ROLE_META[p.role]||ROLE_META["부기장"];return`<td>
${photoCell(p)}
<div class="name">${p.name}</div>
<div class="badge" style="background:${m.bg};color:${m.text};border:0.5px solid ${m.border}">${p.role}</div>
<div class="pos">${p.position!==p.role?p.position:""}</div>
<div class="meta"><span>사번</span> ${p.id}<br><span>입사</span> ${p.joinDate}<br><span>임명</span> ${p.appointDate||"-"}</div>
</td>`;}).join("")}${row.length<6?`<td colspan="${6-row.length}" style="border:none"></td>`:""}</tr>`).join("")}
</table></body></html>`;

  const w=window.open("","_blank","width=1200,height=850");
  w.document.write(html);w.document.close();
  w.onload=()=>{setTimeout(()=>w.print(),300);};
}

// ========================= 전역 노출 =========================
window.setTab=setTab;
window.closeModal=closeModal;
window.openAdd=openAdd;
window.openEdit=openEdit;
window.openDelete=openDelete;
window.openPromote=openPromote;
window.saveForm=saveForm;
window.doDelete=doDelete;
window.doPromote=doPromote;
window.doPrint=doPrint;
window.handleBulkPhotos=handleBulkPhotos;
window.state=state;
window.render=render;

// 앱 시작: 사진 먼저 로딩 후 렌더
render(); // 빈 상태로 일단 표시
initPhotos(); // 비동기로 사진 불러와서 다시 렌더
</script>
</body>
</html>
